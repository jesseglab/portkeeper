name: Build and privacy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portkeeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: portkeeper
      - name: Check out the matching Notchwork prerequisite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jesseglab/notchwork
          ref: c8204d2d285e57cd4a209a9abebb7fa6940ca700
          path: notchwork
      - name: Check release privacy
        run: python3 scripts/check-release-privacy.py
      - name: Build with the pinned Notchwork runtime and SDK
        run: zsh build.sh
      - name: Build and verify drag-and-drop installer
        run: zsh scripts/build-dmg.sh
      - name: Compile native regression tests
        # UI and process regressions run locally in a graphical Mac login session.
        run: zsh Tests/run.sh --build-only
